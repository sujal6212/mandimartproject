<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="wheatBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFDE7"/>
      <stop offset="100%" stop-color="#FFF9C4"/>
    </linearGradient>
    <linearGradient id="grainGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#FFCA28"/>
      <stop offset="100%" stop-color="#FFA000"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#wheatBg)" rx="16"/>
  <ellipse cx="200" cy="250" rx="90" ry="18" fill="#000000" opacity="0.12"/>
  
  <!-- Main stem -->
  <path d="M 200 250 Q 198 160 200 75" stroke="#FFA000" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  
  <!-- Wheat Grains with awns/beards -->
  <!-- Left grains -->
  <ellipse cx="188" cy="85" rx="14" ry="7" fill="url(#grainGrad)" transform="rotate(-35 188 85)"/>
  <line x1="178" y1="80" x2="145" y2="55" stroke="#FF8F00" stroke-width="2"/>
  <ellipse cx="186" cy="115" rx="15" ry="8" fill="url(#grainGrad)" transform="rotate(-30 186 115)"/>
  <line x1="174" y1="110" x2="135" y2="85" stroke="#FF8F00" stroke-width="2"/>
  <ellipse cx="186" cy="145" rx="16" ry="8" fill="url(#grainGrad)" transform="rotate(-25 186 145)"/>
  <line x1="174" y1="140" x2="130" y2="115" stroke="#FF8F00" stroke-width="2"/>
  <ellipse cx="187" cy="175" rx="16" ry="8" fill="url(#grainGrad)" transform="rotate(-20 187 175)"/>
  <line x1="175" y1="170" x2="135" y2="150" stroke="#FF8F00" stroke-width="2"/>

  <!-- Right grains -->
  <ellipse cx="212" cy="85" rx="14" ry="7" fill="url(#grainGrad)" transform="rotate(35 212 85)"/>
  <line x1="222" y1="80" x2="255" y2="55" stroke="#FF8F00" stroke-width="2"/>
  <ellipse cx="214" cy="115" rx="15" ry="8" fill="url(#grainGrad)" transform="rotate(30 214 115)"/>
  <line x1="226" y1="110" x2="265" y2="85" stroke="#FF8F00" stroke-width="2"/>
  <ellipse cx="214" cy="145" rx="16" ry="8" fill="url(#grainGrad)" transform="rotate(25 214 145)"/>
  <line x1="226" y1="140" x2="270" y2="115" stroke="#FF8F00" stroke-width="2"/>
  <ellipse cx="213" cy="175" rx="16" ry="8" fill="url(#grainGrad)" transform="rotate(20 213 175)"/>
  <line x1="225" y1="170" x2="265" y2="150" stroke="#FF8F00" stroke-width="2"/>
  
  <text x="200" y="280" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#E65100" letter-spacing="1">SHARBATI GOLDEN WHEAT · GRADE A+</text>
</svg>
