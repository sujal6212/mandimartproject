  <path d="M 200 115 Q 215 135 225 140 Q 212 126 200 115 Z" fill="url(#leafGrad)"/>
  
  <!-- Text Label -->
  <text x="200" y="278" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#2E7D32" letter-spacing="1">FRESH DESI TOMATO · GRADE A+</text>
